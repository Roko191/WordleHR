<!DOCTYPE html>
<html class="w-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="/src/style.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-darkBg w-full m-0 p-0">
<h1 class="title">
    WordleHR
</h1>
<div class="max-w-lg mx-auto px-4">
    <div id="dbgAlert" class="alert-box">
        <p class="text-center"><i class="fa-solid fa-triangle-exclamation"></i> This is a <b>Debug page</b>!</p>
    </div>

    <div id="box-examples">
        <h2 class="text-[35px] font-wordle text-white mt-5 mb-7">Letter boxes</h2>
            <div class="mb-10">
            <div id="allBoxesType" class="grid-wordle">
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-eval">K</div>
                <div class="letter-box exists">U</div>
                <div class="letter-box not-found">Ć</div>
                <div class="letter-box found">A</div>
            </div>
            
            <h3 class="text-white text-md uppercase tracking-wide mb-2 text-center">Empty Boxes</h3>
            <div id="emptyBoxes" class="grid-wordle">
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
            </div>

            <h3 class="text-white text-md uppercase tracking-wide mb-2 text-center">Not evaluated</h3>
            <div id="notEval" class="grid-wordle">
                <div class="letter-box no-eval">B</div>
                <div class="letter-box no-eval">I</div>
                <div class="letter-box no-eval">R</div>
                <div class="letter-box no-eval">A</div>
                <div class="letter-box no-eval">Č</div>
            </div>

            <h3 class="text-white text-md uppercase tracking-wide mb-2 text-center">Evaluated</h3>
            <div id="notEval" class="grid-wordle">
                <div class="letter-box not-found">B</div>
                <div class="letter-box found">O</div>
                <div class="letter-box exists">M</div>
                <div class="letter-box found">B</div>
                <div class="letter-box found">A</div>
            </div>
        </div>
    </div>

    <div class="grid-examples">
        <h2 class="text-[35px] font-wordle text-white mt-5 mb-7">Grid</h2>
        <h3 class="text-white text-md uppercase tracking-wide mb-2 text-center">Regular 5x5 grid</h3>
        <div id="regular-grid" class="grid-wordle">
                <!-- ROW 1 -->
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>

                <!-- ROW 2 -->
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>

                <!-- ROW 3 -->
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>

                <!-- ROW 4 -->
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>

                <!-- ROW 5 -->
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
                <div class="letter-box no-letter"></div>
        </div>


        <div id="dynamic-grid" class="mt-5">
            <h3 class="text-white text-md uppercase tracking-wide mb-2 text-center">Dynamic grid gen</h3>
            <label class="text-primary font-medium">
              Number of attempts:
            </label>
            <br>
            <input id="dynamic-grid-input" autocomplete="off" type="number" class="mb-5" placeholder="5">
            <div id="dynamic-gen-grid">

            </div>
        </div>
    </div>


</div>

<footer>
    <div id="footer">
        <h3 class="font-wordle text-5xl mb-4">WordleHR</h3>
        <p class="font-medium text-[#818384] mb-2">Napravio Roko191</p>
        <p class="font-medium text-[#818384] mb-2">
            Inspirirano <a href="https://www.nytimes.com/games/wordle" class="text-primary hover:text-white underline transition-colors">New York Times Wordle</a>
        </p>
        <p class="font-medium text-[#565758] text-sm">&COPY; 2026 Roko191 |  <a target="_blank" href="https://opensource.org/licenses/MIT">MIT Licenca</a></p>
    </div>
</footer>


<script type="module" src="/src/dbg.ts"></script>
</body>
</html>
